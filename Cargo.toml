[package]
name = "tlt-stops"
version = "0.1.0"
edition = "2024"
authors = ["MiX <13241662+iNViTiON@users.noreply.github.com>"]

[package.metadata.release]
release = false

[profile.release]
lto = true
strip = "debuginfo"
codegen-units = 1

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.8", features = ['http', 'axum'] }
worker-macros = { version = "0.8", features = ['http'] }
tower-service = "0.3.3"
console_error_panic_hook = { version = "0.1.7" }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
tokio = { version = "1.53.1", default-features = false, features = ["rt", "time"] }
js-sys = "0.3.103"
memchr = "2.8.3"
futures = "0.3.33"
wasm-streams = "0.6"
urlencoding = "2.1.3"
utoipa = "5.5.0"
