name = "tlt-stops"
main = "build/worker/shim.mjs"
compatibility_date = "2025-11-04"

[build]
# worker-build is majorly versioned in lockstep with the worker crate since 0.7
# and errors out on a mismatch, so keep this pin aligned with Cargo.toml.
command = "cargo install worker-build@^0.8 && worker-build --release"
dcommand = "worker-build --dev"
rcommand = "worker-build --release"

[observability]
enabled = true

[placement]
mode = "smart"
